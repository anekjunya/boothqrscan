<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สแกน QR Code</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f7;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 500px;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            margin: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        .button {
            display: inline-block;
            background-color: #007aff;
            color: white;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            margin: 10px 0;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 122, 255, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 122, 255, 0.3);
        }
        
        .steps {
            text-align: left;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .steps h3 {
            margin-top: 0;
            color: #333;
        }
        
        .steps ol {
            margin: 0;
            padding-left: 25px;
        }
        
        .steps li {
            margin-bottom: 10px;
        }
        
        .browser-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        .browser-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f1f1;
        }
        
        .safari {
            background: linear-gradient(135deg, #0fb4ff 0%, #1674e9 100%);
            color: white;
        }
        
        .chrome {
            background: white;
            border: 1px solid #eee;
        }
        
        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        
        #qrResult {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        
        .error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        
        .camera-area {
            width: 100%;
            max-width: 300px;
            height: 300px;
            background-color: #eee;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: none;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .target-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid #007aff;
            border-radius: 10px;
        }
        
        .target-box::before, .target-box::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #007aff;
            border-style: solid;
            border-width: 0;
        }
        
        .target-box::before {
            top: -2px;
            left: -2px;
            border-top-width: 2px;
            border-left-width: 2px;
            border-top-left-radius: 8px;
        }
        
        .target-box::after {
            bottom: -2px;
            right: -2px;
            border-bottom-width: 2px;
            border-right-width: 2px;
            border-bottom-right-radius: 8px;
        }
        
        .note {
            font-size: 14px;
            color: #999;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>สแกน QR Code เพื่อรับของรางวัล</h1>
        
        <div class="browser-icons">
            <div class="browser-icon safari">
                <svg viewBox="0 0 24 24" width="30" height="30">
                    <path fill="currentColor" d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M12,10.5A1.5,1.5 0 0,1 13.5,12A1.5,1.5 0 0,1 12,13.5A1.5,1.5 0 0,1 10.5,12A1.5,1.5 0 0,1 12,10.5M7.5,7.5L16.5,16.5M16.5,7.5L7.5,16.5"></path>
                </svg>
            </div>
            <div class="browser-icon chrome">
                <svg viewBox="0 0 24 24" width="30" height="30">
                    <path fill="#DB4437" d="M12,20L15.46,14H15.45C15.79,13.4 16,12.73 16,12C16,10.8 15.46,9.73 14.62,9H19.41C19.79,9.93 20,10.94 20,12A8,8 0 0,1 12,20M4,12C4,10.54 4.39,9.18 5.07,8L8.54,14H8.55C9.24,15.19 10.5,16 12,16C12.45,16 12.88,15.91 13.29,15.77L10.89,19.91C7,19.37 4,16.04 4,12M15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9A3,3 0 0,1 15,12M12,4C14.96,4 17.54,5.61 18.92,8H12C10.06,8 8.45,9.38 8.08,11.21L5.7,7.08C7.16,5.21 9.44,4 12,4M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"></path>
                </svg>
            </div>
        </div>
        
        <div class="camera-area" id="cameraArea">
            <video id="video"></video>
            <div class="target-box"></div>
        </div>
        
        <button class="button" id="startCamera">เปิดกล้องเพื่อสแกน QR Code</button>
        
        <input type="file" id="fileInput" class="file-input" accept="image/*">
        
        <div id="qrResult"></div>
        
        <div class="steps">
            <h3>วิธีการใช้งาน:</h3>
            <ol>
                <li>กดปุ่ม "เปิดกล้องเพื่อสแกน QR Code</li>
                <li>อนุญาติให้เข้าถึงกล้อง"</li>
                <li>สแกนเพื่อตอบคำถามให้ถูกต้อง</li>
                <li>สะสมให้ครบทุกบู๊ธเพื่อแลกรับของรางวัล</li>
            </ol>
        </div>
        
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.4/html5-qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startCameraButton = document.getElementById('startCamera');
            const cameraArea = document.getElementById('cameraArea');
            const qrResult = document.getElementById('qrResult');
            const fileInput = document.getElementById('fileInput');
            let scanner;
            
            startCameraButton.addEventListener('click', () => {
                cameraArea.style.display = 'block';
                startCameraButton.style.display = 'none';
                
                scanner = new Html5Qrcode("cameraArea");
                const config = { fps: 10, qrbox: 250 };
                
                scanner.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanError
                ).catch(err => {
                    showResult(`ไม่สามารถเข้าถึงกล้องได้: ${err}`, false);
                    cameraArea.style.display = 'none';
                    startCameraButton.style.display = 'inline-block';
                });
            });
            
            fileInput.addEventListener('change', event => {
                const file = event.target.files[0];
                if (!file) {
                    return;
                }
                
                const html5QrcodeScanner = new Html5Qrcode("cameraArea");
                html5QrcodeScanner.scanFile(file, true)
                    .then(decodedText => {
                        onScanSuccess(decodedText);
                    })
                    .catch(err => {
                        showResult(`ไม่พบ QR Code ในภาพ: ${err}`, false);
                    });
            });
            
            function onScanSuccess(decodedText) {
                if (scanner) {
                    scanner.stop().then(() => {
                        cameraArea.style.display = 'none';
                        startCameraButton.style.display = 'inline-block';
                    });
                }
                
                showResult(`พบ QR Code: ${decodedText}`, true);
                
                // ตรวจสอบว่า URL ถูกต้องก่อนเปิด
                if (isValidUrl(decodedText)) {
                    setTimeout(() => {
                        window.location.href = decodedText;
                    }, 1000);
                } else {
                    showResult(`ข้อมูลไม่ใช่ URL ที่ถูกต้อง: ${decodedText}`, false);
                }
            }
            
            function onScanError(err) {
                // ไม่ทำอะไร - แค่ยังคงสแกนต่อไป
            }
            
            function showResult(message, success) {
                qrResult.textContent = message;
                qrResult.style.display = 'block';
                
                if (success) {
                    qrResult.className = 'success';
                } else {
                    qrResult.className = 'error';
                }
                
                setTimeout(() => {
                    qrResult.style.display = 'none';
                }, 5000);
            }
            
            function isValidUrl(string) {
                try {
                    new URL(string);
                    return true;
                } catch (_) {
                    return false;
                }
            }
        });
    </script>
</body>
</html>
