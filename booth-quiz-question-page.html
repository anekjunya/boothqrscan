        // Get booth ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const boothId = parseInt(urlParams.get('booth'));
        
        // Variables to track progress
        let completedBooths = [];
        
        // Check if there's saved progress in localStorage
        if (localStorage.getItem('completedBooths')) {
            completedBooths = JSON.parse(localStorage.getItem('completedBooths'));
        }

        // Function to initialize the page
        function initPage() {
            // Check if booth ID is valid
            if (!boothId || isNaN(boothId) || boothId < 1 || boothId > 25) {
                window.location.href = 'booth-quiz-main-page.html'; // Redirect to main page if invalid
                return;
            }
            
            // Get booth information
            const booth = booths.find(b => b.id === boothId);
            if (!booth) {
                window.location.href = 'booth-quiz-main-page.html'; // Redirect if booth not found
                return;
            }
            
            // Set booth name and logo
            document.getElementById('booth-name').textContent = booth.name;
            const logoElement = document.getElementById('booth-logo');
            logoElement.src = booth.logo;
            logoElement.alt = booth.name + ' logo';
            
            // Check if this booth is already completed
            if (completedBooths.includes(boothId)) {
                document.getElementById('question-section').style.display = 'none';
                document.getElementById('completed-section').style.display = 'block';
                logoElement.classList.add('completed');
            } else {
                // Find the question for this booth
                const question = questions.find(q => q.boothId === boothId);
                if (!question) {
                    window.location.href = 'booth-quiz-main-page.html'; // Redirect if question not found
                    return;
                }
                
                // Set question text
                document.getElementById('question-text').textContent = question.questionText;
                
                // Generate answer buttons
                const answersContainer = document.getElementById('answers-container');
                question.options.forEach((option, index) => {
                    const answerButton = document.createElement('button');
                    answerButton.className = 'answer-btn';
                    answerButton.textContent = option.text;
                    
                    answerButton.addEventListener('click', () => {
                        checkAnswer(option.isCorrect, boothId);
                    });
                    
                    answersContainer.appendChild(answerButton);
                });
            }
            
            // Add event listener for back button
            document.getElementById('back-btn').addEventListener('click', () => {
                window.location.href = 'booth-quiz-main-page.html';
            });
        }
        
        // Function to check answer
        function checkAnswer(isCorrect, boothId) {
            if (isCorrect) {
                // Mark booth as completed
                if (!completedBooths.includes(boothId)) {
                    completedBooths.push(boothId);
                    localStorage.setItem('completedBooths', JSON.stringify(completedBooths));
                }
                
                // Change logo to colored version
                const logoElement = document.getElementById('booth-logo');
                logoElement.classList.add('completed');
                
                // Show success message
                
                    window.location.href = 'booth-quiz-main-page.html';
               
            } 
        }
