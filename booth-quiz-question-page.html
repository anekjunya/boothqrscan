<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รับ E-Stamp</title>
<style>
body { font-family: Prompt, sans-serif; background:#f0f2f5; padding:20px }
.container {
  max-width:600px; margin:auto; background:#fff;
  padding:20px; border-radius:10px; text-align:center
}
.logo {
  width:80px; height:80px; border-radius:50%;
  margin:10px; background:#fff
}
.btn {
  margin-top:20px; padding:12px 30px;
  background:#4CAF50; color:#fff;
  border:none; border-radius:6px;
  font-size:18px; cursor:pointer
}
</style>
</head>
<body>

<div class="container">
  <h2>คุณได้รับ E-Stamp</h2>
  <div id="logo-container"></div>
  <button class="btn" id="confirm-btn">รับ E-Stamp</button>
</div>

<script>
const booths = [
  {id:1,name:'S1',logo:'logo/cmru.png'},
  {id:2,name:'S2',logo:'logo/cmru.png'},
  {id:3,name:'G1',logo:'logo/cmru.png'},
  {id:4,name:'G2',logo:'logo/cmru.png'},
  {id:5,name:'G3',logo:'logo/cmru.png'},
  {id:6,name:'G4',logo:'logo/cmru.png'}
];

// อ่าน booths จาก URL
const params = new URLSearchParams(window.location.search);
const boothIds = params.get('booths')
  ? params.get('booths').split(',').map(Number)
  : [];

if (boothIds.length === 0) {
  window.location.href = 'booth-quiz-main-page.html';
}

// แสดงหลายโลโก้
const logoContainer = document.getElementById('logo-container');
boothIds.forEach(id => {
  const booth = booths.find(b => b.id === id);
  if (!booth) return;
  const img = document.createElement('img');
  img.src = booth.logo;
  img.className = 'logo';
  logoContainer.appendChild(img);
});

// บันทึกหลาย booth พร้อมกัน
document.getElementById('confirm-btn').onclick = () => {
  let completed = JSON.parse(localStorage.getItem('completedBooths')) || [];
  boothIds.forEach(id => {
    if (!completed.includes(id)) completed.push(id);
  });
  localStorage.setItem('completedBooths', JSON.stringify(completed));
  window.location.href = 'booth-quiz-main-page.html';
};
</script>

</body>
</html>
