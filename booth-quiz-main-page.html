<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARIT13</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js"></script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .booths {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .booth {
      background-color: transparent;
      box-shadow: none;
      border: none;
      padding: 2px;
      text-align: center;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 60px;
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: contain;
      object-position: center;
      background-color: #fff;
      filter: grayscale(100%);
      transition: filter 0.5s;
    }

    .logo-wrapper.completed .logo {
      filter: grayscale(0%);
    }

    .checkmark {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 20px;
      height: 20px;
      background-color: #4CAF50;
      color: white;
      border-radius: 50%;
      font-size: 14px;
      text-align: center;
      line-height: 20px;
      font-weight: bold;
      display: none;
      z-index: 2;
    }

    .logo-wrapper.completed .checkmark {
      display: block;
    }

    .booth h3 {
      font-size: 12px;
      margin-top: 2px;
      color: #333;
      text-align: center;
    }

    .progress {
      margin-top: 30px;
      text-align: center;
      font-size: 18px;
      color: #666;
    }

    .reward-btn {
      display: none;
      margin: 30px auto;
      padding: 15px 30px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .reward-btn:hover {
      background-color: #45a049;
    }

    .header-image {
      max-width: 100%;
      height: auto;
      margin-bottom: 30px;
    }

    .scan-btn {
      display: block;
      margin: 20px auto;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease-in-out;
    }

    .scan-btn:hover {
      background: linear-gradient(135deg, #45a049, #1B5E20);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 768px) {
      .booths {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo/poster2026.jpg" alt="AutomationDay 2025" class="header-image">

    <div class="booths" id="booths-container"></div>

    <div class="progress" id="progress">
      ความคืบหน้า: <span id="progress-count">0</span>/25
    </div>

    <button class="reward-btn" id="reward-btn">แสดงหน้าจอเพื่อรับของสมนาคุณ</button>
  </div>

  <div>
    <button class="scan-btn" id="scan-btn">🔍 สแกน QR Code</button>
  </div>

  <script>
    const booths = [
      { id: 1, name: 'Dell', logo: 'logo/dell.jpg' },
      { id: 2, name: 'Nvidia', logo: 'logo/nvidia.jpg' },
      { id: 3, name: 'Sangfor', logo: 'logo/sangfor.jpg' },
      { id: 4, name: 'Sophos', logo: 'logo/sophos.jpg' },
      { id: 5, name: 'Fortinet', logo: 'logo/fortinet.jpg' },
      { id: 6, name: 'Microsoft', logo: 'logo/microsoft.jpg' },
      { id: 7, name: 'HP', logo: 'logo/hp.png' },
      { id: 8, name: 'Microsoft Surface', logo: 'logo/mssurface.jpg' },
      { id: 9, name: 'Microsoft Security', logo: 'logo/mssecurity.jpg' },
      { id: 10, name: 'Aruba', logo: 'logo/aruba.jpg' },
      { id: 11, name: 'Interlink', logo: 'logo/interlink.jpg' },
      { id: 12, name: 'WD', logo: 'logo/wd.jpg' },
      { id: 13, name: 'Microsoft OEM', logo: 'logo/msoem.jpg' },
      { id: 14, name: 'APC', logo: 'logo/apc.jpg' },
      { id: 15, name: 'Hikvision', logo: 'logo/hikvision.jpg' },
      { id: 16, name: 'Sonicwall', logo: 'logo/sonicwall.jpg' },
      { id: 17, name: 'SIS Cloud', logo: 'logo/siscloud.jpg' },
      { id: 18, name: 'Macrocare', logo: 'logo/macrocare.jpg' },
      { id: 19, name: 'iDoctor', logo: 'logo/idoctor.jpg' },
      { id: 20, name: 'SVOA', logo: 'logo/svoa.jpg' },
      { id: 21, name: 'MSI OEM', logo: 'logo/msi.jpg' },
      { id: 22, name: 'ASUS', logo: 'logo/asus.jpg' },
      { id: 23, name: 'Syndome', logo: 'logo/syndome.jpg' },
      { id: 24, name: 'Intel', logo: 'logo/intel.png' },
      { id: 25, name: 'A&A', logo: 'logo/aa.jpg' }
    ];

    let completedBooths = [];
    if (localStorage.getItem('completedBooths')) {
      completedBooths = JSON.parse(localStorage.getItem('completedBooths'));
    }

    function generateBooths() {
      const boothsContainer = document.getElementById('booths-container');
      booths.forEach(booth => {
        const boothElement = document.createElement('div');
        boothElement.className = 'booth';
        boothElement.dataset.id = booth.id;

        const wrapper = document.createElement('div');
        wrapper.className = 'logo-wrapper';
        if (completedBooths.includes(booth.id)) {
          wrapper.classList.add('completed');
        }

        const logoElement = document.createElement('img');
        logoElement.src = booth.logo;
        logoElement.alt = booth.name + ' logo';
        logoElement.className = 'logo';

        const checkmark = document.createElement('div');
        checkmark.className = 'checkmark';
        checkmark.innerHTML = '✔';

        wrapper.appendChild(logoElement);
        wrapper.appendChild(checkmark);

        const nameElement = document.createElement('h3');
        nameElement.textContent = booth.name;

        boothElement.appendChild(wrapper);
        boothElement.appendChild(nameElement);
        boothsContainer.appendChild(boothElement);
      });

      updateProgress();
    }

    function updateProgress() {
      const progressCount = document.getElementById('progress-count');
      progressCount.textContent = completedBooths.length;
      if (completedBooths.length === booths.length) {
        document.getElementById('reward-btn').style.display = 'block';
      }
    }

    document.getElementById('reward-btn').addEventListener('click', () => {
      swal({
        title: "ยินดีด้วย!",
        text: "คุณสามารถรับของรางวัลได้แล้ว!",
        icon: "success",
        button: "รับของรางวัล",
      });
    });

    window.addEventListener('storage', (event) => {
      if (event.key === 'completedBooths') {
        completedBooths = JSON.parse(event.newValue);
        updateBoothsDisplay();
        updateProgress();
      }
    });

    function updateBoothsDisplay() {
      booths.forEach(booth => {
        const wrapper = document.querySelector(`.booth[data-id="${booth.id}"] .logo-wrapper`);
        if (wrapper) {
          wrapper.classList.toggle('completed', completedBooths.includes(booth.id));
        }
      });
    }

    // Load booths
    generateBooths();

    // Go to scanner
    document.getElementById('scan-btn').addEventListener('click', function() {
      window.location.href = 'qr-scanner-webpage.html';
    });
  </script>
</body>
</html>
