<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&A SolutionDay 2025</title>
<style>
body { font-family: Prompt, sans-serif; background:#f0f2f5; padding:20px }
.booths { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:20px }
.booth { text-align:center }
.logo-wrapper { position:relative; display:inline-block }
.logo {
  width:60px; height:60px; border-radius:50%;
  background:#fff; filter:grayscale(100%);
}
.logo-wrapper.completed .logo { filter:grayscale(0%) }
.checkmark {
  position:absolute; top:-5px; right:-5px;
  width:20px; height:20px; background:#4CAF50;
  color:#fff; border-radius:50%; font-size:14px;
  line-height:20px; display:none;
}
.logo-wrapper.completed .checkmark { display:block }
</style>
</head>
<body>

<h2>Booth Stamp</h2>
<div class="booths" id="booths"></div>

<script>
const booths = [
  {id:1,name:'S1',logo:'logo/cmru.png'},
  {id:2,name:'S2',logo:'logo/cmru.png'},
  {id:3,name:'G1',logo:'logo/cmru.png'},
  {id:4,name:'G2',logo:'logo/cmru.png'},
  {id:5,name:'G3',logo:'logo/cmru.png'},
  {id:6,name:'G4',logo:'logo/cmru.png'}
];

let completedBooths = JSON.parse(localStorage.getItem('completedBooths')) || [];

function render() {
  const c = document.getElementById('booths');
  c.innerHTML = '';
  booths.forEach(b => {
    const div = document.createElement('div');
    div.className = 'booth';

    const w = document.createElement('div');
    w.className = 'logo-wrapper';
    if (completedBooths.includes(b.id)) w.classList.add('completed');

    const img = document.createElement('img');
    img.src = b.logo;
    img.className = 'logo';

    const chk = document.createElement('div');
    chk.className = 'checkmark';
    chk.textContent = '✔';

    w.append(img, chk);
    div.append(w, document.createElement('div')).lastChild.textContent = b.name;
    c.append(div);
  });
}

render();
window.addEventListener('storage', render);
</script>
</body>
</html>
